name: Refresh data and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rising:
        description: "Refresh rising results even if the daily snapshot is still fresh"
        type: boolean
        default: false
  schedule:
    # Every 4 hours for fresher data. GitHub may delay under load.
    - cron: "2 */4 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_NAME: agent-landscape-live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RISING: ${{ inputs.force_rising && '1' || '0' }}
        run: node scripts/fetch-live.mjs

      - name: Commit refreshed snapshot
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "chore: refresh live snapshot [skip ci]"
            git push
          fi

      - name: Prepare static artifact
        run: node scripts/build-dist.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main
